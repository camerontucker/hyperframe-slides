[package]
name = "hyperframe-slides"
version = "0.0.1-alpha.2"
edition = "2021"
description = "Native Rust presentation editor for Omarchy with HyperFrames and Zoom audience windows"
license = "MIT"
repository = "https://github.com/camerontucker/hyperframe-slides"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit = { package = "webkit6", version = "0.6" }
base64 = "0.22"
pulldown-cmark = "0.13"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
