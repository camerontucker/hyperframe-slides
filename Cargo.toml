[package]
name = "hyperframe-slides"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = "0.18"
webkit2gtk = { version = "2.0.2", features = ["v2_22"] }
javascriptcore-rs = "1.1.2"
base64 = "0.22"
pulldown-cmark = "0.13"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
