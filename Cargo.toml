[package]
name = "hyperframe-slides"
version = "0.0.1-alpha.1"
edition = "2021"
description = "Native Rust presentation editor for Omarchy with HyperFrames and Zoom audience windows"
license = "MIT"
repository = "https://github.com/camerontucker/hyperframe-slides"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = "0.18"
webkit2gtk = { version = "2.0.2", features = ["v2_22"] }
javascriptcore-rs = "1.1.2"
base64 = "0.22"
pulldown-cmark = "0.13"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
