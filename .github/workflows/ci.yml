name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Use current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Check formatting, tests, and lints
        run: |
          cargo fmt --check
          cargo test --locked --quiet
          cargo clippy --locked --quiet -- -D warnings

      - name: Build and check launcher
        run: |
          ./install.sh
          desktop-file-validate "$HOME/.local/share/applications/hyperframe-slides.desktop"

      - name: Check scripts and whitespace
        run: |
          bash -n install.sh uninstall.sh tests/live-presenter.sh
          git show --check --format= --no-renames HEAD
